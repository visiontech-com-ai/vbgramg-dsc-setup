lockPref("app.update.enabled", false);
lockPref("app.update.auto", false);
lockPref("app.update.mode", 0);
lockPref("app.update.service.enabled", false);
lockPref("app.update.staging.enabled", false);
lockPref("app.update.silent", false);
lockPref("app.update.url", "");
lockPref("app.update.url.details", "");
lockPref("app.update.url.manual", "");
lockPref("app.update.promptWaitTime", 999999999);
lockPref("extensions.update.enabled", false);
lockPref("browser.search.update", false);
lockPref("browser.shell.checkDefaultBrowser", false);
// Force the Java applet plugin to "Always Activate" (2) so the NREGA/VBGRAMG
// digital-signature applet runs without the user having to click to enable it.
// Firefox 43 defaults NPAPI plugins to click-to-play (1); this sets it on.
defaultPref("plugin.state.java", 2);
defaultPref("plugin.state.npdeployjava", 2);
lockPref("plugins.click_to_play", false);
// CRITICAL: Mozilla's blocklist hard-blocks the old Java NPAPI plugin, which
// removes it from Firefox entirely ("A plugin is needed..."). Disable the
// blocklist and cut off the server that delivers it so the Java plugin stays
// visible and usable. This is the standard fix for Java on legacy Firefox.
lockPref("extensions.blocklist.enabled", false);
lockPref("extensions.blocklist.url", "");
lockPref("services.blocklist.update_enabled", false);
// Scan all registered plugin IDs from the registry (inclusive detection).
defaultPref("plugin.scan.plid.all", true);
