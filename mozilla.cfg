//
lockPref("app.update.enabled", false);
lockPref("app.update.auto", false);
lockPref("app.update.mode", 0);
lockPref("app.update.service.enabled", false);
lockPref("app.update.staging.enabled", false);
lockPref("app.update.silent", false);
lockPref("app.update.url", "");
lockPref("app.update.url.details", "");
lockPref("app.update.url.manual", "");
lockPref("app.update.promptWaitTime", 999999999);
lockPref("extensions.update.enabled", false);
lockPref("browser.search.update", false);
lockPref("browser.shell.checkDefaultBrowser", false);
// Force the Java applet plugin to "Always Activate" (2) so the NREGA/VBGRAMG
// digital-signature applet runs without the user having to click to enable it.
// Firefox 43 defaults NPAPI plugins to click-to-play (1); this sets it on.
defaultPref("plugin.state.java", 2);
defaultPref("plugin.state.npdeployjava", 2);
lockPref("plugins.click_to_play", false);
// CRITICAL: Mozilla's blocklist hard-blocks the old Java NPAPI plugin, which
// removes it from Firefox entirely ("A plugin is needed..."). Disable the
// blocklist and cut off the server that delivers it so the Java plugin stays
// visible and usable. This is the standard fix for Java on legacy Firefox.
lockPref("extensions.blocklist.enabled", false);
lockPref("extensions.blocklist.url", "");
lockPref("services.blocklist.update_enabled", false);
// Scan all registered plugin IDs from the registry (inclusive detection).
defaultPref("plugin.scan.plid.all", true);
// Enable copy/paste even on portals that try to block it (govt sites often
// disable paste in the password field via JavaScript). Stopping pages from
// receiving copy/cut/paste events re-enables normal clipboard use.
lockPref("dom.event.clipboardevents.enabled", false);
// Remember and auto-fill the portal login so it does not have to be typed every
// time. Save prompts appear even when the site sets autocomplete="off".
defaultPref("signon.rememberSignons", true);
defaultPref("signon.autofillForms", true);
defaultPref("signon.storeWhenAutocompleteOff", true);
// Pre-seed a PLACEHOLDER login for the portal so the fields are pre-filled.
// Replace it with your real id/password on first login and Firefox will keep it.
// Wrapped in try/catch so it can never break the rest of this config.
try {
  var _vbgLM = Components.classes["@mozilla.org/login-manager;1"]
                 .getService(Components.interfaces.nsILoginManager);
  var _vbgHost = "https://vbgramgweb1.dord.gov.in";
  if (_vbgLM.findLogins({}, _vbgHost, _vbgHost, null).length === 0) {
    var _vbgLI = new Components.Constructor(
      "@mozilla.org/login-manager/loginInfo;1",
      Components.interfaces.nsILoginInfo, "init");
    _vbgLM.addLogin(new _vbgLI(_vbgHost, _vbgHost, null,
      "enter-your-id", "enter-your-password", "", ""));
  }
} catch (e) {}
// Stop Firefox from creating its "smart bookmarks" (Most Visited, Recently
// Bookmarked, Recent Tags) - a high version makes it think they are current.
defaultPref("browser.bookmarks.smartBookmarksVersion", 999);
// Remove Firefox's default bookmarks and keep ONLY ours on the Bookmarks
// Toolbar (1st Sign, 2nd Sign, Vision Technologies). Deferred until the
// bookmark system is ready (browser-delayed-startup-finished) and run once per
// profile (guarded by a persisted pref). try/catch so it can never break config.
try {
  var _vbgObs = Components.classes["@mozilla.org/observer-service;1"]
                  .getService(Components.interfaces.nsIObserverService);
  var _vbgBmObs = {
    observe: function (s, topic, d) {
      try { _vbgObs.removeObserver(_vbgBmObs, "browser-delayed-startup-finished"); } catch (e) {}
      try {
        var _pb = Components.classes["@mozilla.org/preferences-service;1"]
                    .getService(Components.interfaces.nsIPrefBranch);
        var _seeded = false;
        try { _seeded = _pb.getBoolPref("vbgramg.bookmarks.seeded"); } catch (e) {}
        if (_seeded) { return; }
        var _bm = Components.classes["@mozilla.org/browser/nav-bookmarks-service;1"]
                    .getService(Components.interfaces.nsINavBookmarksService);
        var _io = Components.classes["@mozilla.org/network/io-service;1"]
                    .getService(Components.interfaces.nsIIOService);
        _bm.removeFolderChildren(_bm.toolbarFolder);
        _bm.removeFolderChildren(_bm.bookmarksMenuFolder);
        function _vbgAdd(t, u) {
          _bm.insertBookmark(_bm.toolbarFolder, _io.newURI(u, null, null), _bm.DEFAULT_INDEX, t);
        }
        _vbgAdd("1st Sign", "https://vbgramgweb1.dord.gov.in/VBGRAMG/FTO/Login.aspx?&level=HomeACGP&state_code=32");
        _vbgAdd("2nd Sign", "https://vbgramgweb1.dord.gov.in/VBGRAMG/FTO/Login.aspx?&level=HomeWLGP&state_code=32");
        _vbgAdd("Vision Technologies", "https://visiontech.com.in");
        _pb.setBoolPref("vbgramg.bookmarks.seeded", true);
      } catch (e) {}
    }
  };
  _vbgObs.addObserver(_vbgBmObs, "browser-delayed-startup-finished", false);
} catch (e) {}
